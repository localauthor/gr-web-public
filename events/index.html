<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events | Grant Rosson</title>
<meta name="description" content="Music, art and literature, nature, family, market and sports events around Elektrėnai, Vievis, Trakai, Kaišiadorys, Kernavė and Vilnius.">
<link rel="icon" href="/favicon.png">
<style>
:root {
  --bg: #faf8f4; --card: #fff; --ink: rgba(0,0,0,.84); --muted: #6b665c; --line: #e7e2d8;
  --accent: rgb(127,112,80); --accent-soft: #f1ece1; --pick: #fbf3df; --pick-edge: #d9a521;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
a { color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 28px; line-height: 1.2; margin: 8px 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tab { appearance: none; border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 10px 14px; white-space: nowrap; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.range { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 18px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.chip { appearance: none; flex: 1 1 auto; font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 0; background: none; color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--ink); }
.chip[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.picks { background: var(--pick); border-left: 4px solid var(--pick-edge); border-radius: 6px; padding: 12px 16px; margin-bottom: 18px; }
.picks h2 { font-size: 15px; margin: 0 0 6px; }
.picks ul { margin: 0; padding-left: 18px; font-size: 15px; }
.note { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; font-size: 14px; margin-bottom: 10px; }
h2.area { font-size: 19px; margin: 26px 0 2px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
h3.week { font-size: 15px; margin: 24px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ev { padding: 11px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
.date { text-align: center; line-height: 1.1; padding-top: 2px; }
.date .d { font-size: 22px; font-weight: 700; }
.date .w { font-size: 12px; color: var(--muted); text-transform: uppercase; }
.title { font-weight: 650; font-size: 16px; text-decoration: none; }
.title:hover { text-decoration: underline; }
.meta { font-size: 13px; color: var(--muted); margin: 2px 0 3px; }
.desc { font-size: 14px; margin: 0; }
.tag { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; margin-right: 6px; }
.tag.lang { color: #fff; background: var(--accent); border-radius: 3px; padding: 0 5px; }
.addcal { appearance: none; border: 0; background: none; margin: 6px auto 0; padding: 5px; border-radius: 6px; color: var(--muted); cursor: pointer; display: block; line-height: 0; }
.addcal:hover, .addcal:focus-visible { color: var(--accent); background: var(--accent-soft); }
#cal { border: 1px solid var(--line); border-radius: 10px; padding: 18px 18px 16px; width: min(340px, calc(100vw - 32px)); background: var(--card); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.15); }
#cal::backdrop { background: rgba(0,0,0,.25); }
#cal h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 28px 4px 0; }
#cal .t { font-weight: 650; margin: 0 0 14px; }
#cal label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
#cal label[hidden] { display: none; }
#cal input { display: block; margin-top: 4px; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
#cal .go { display: flex; gap: 8px; }
#cal .go > * { flex: 1; appearance: none; border: 0; border-radius: 6px; padding: 9px 8px; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; text-align: center; text-decoration: none; background: var(--accent); color: #fff; cursor: pointer; }
#cal .x { position: absolute; top: 10px; right: 10px; appearance: none; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px 6px; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Events</h1>
  <p class="sub">Music, art and literature, nature, family, markets and sports in Elektrėnai, Vievis, Trakai, Kaišiadorys, Kernavė and Vilnius. Updated weekly.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="week" aria-selected="true">This week</button>
    <button class="tab" role="tab" data-tab="month" aria-selected="false">This month</button>
  </div>
  <p class="range" id="range"></p>
  <div class="chips" id="chips" role="tablist"></div>
  <div id="out"><p class="empty">Loading events…</p></div>

  <footer id="foot"></footer>
</div>

<dialog id="cal" aria-labelledby="cal-h">
  <button class="x" aria-label="Close">×</button>
  <h2 id="cal-h">Add to calendar</h2>
  <p class="t"></p>
  <label>Which day?<input type="date"></label>
  <div class="go"><a target="_blank" rel="noopener">Google</a><button class="ics">Apple / Outlook</button></div>
</dialog>

<script>
const AREAS = { near: "Near home: Elektrėnai & Vievis", region: "Around the region: Trakai · Kaišiadorys · Kernavė · Neris Park", vilnius: "Vilnius" };
const CATS = { music: "Music", family: "Family", nature: "Nature", art: "Art", markets: "Markets", sports: "Sports" };
const ART_GROUPS = [["Exhibitions & art", e => !e.lit], ["Literature in English", e => e.lit && e.lang === "en"], ["Literature in Lithuanian", e => e.lit && e.lang !== "en"]];
const LANGS = { en: "In English", lt: "In Lithuanian" };
const state = { tab: "week", cat: "" };
try { const t = localStorage.getItem("events-tab"); if (t === "week" || t === "month") state.tab = t; } catch (e) {}

const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
// Calendar-day arithmetic, so ranges stay whole days across DST changes.
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const fmt = (d, o) => d.toLocaleDateString("en-GB", o);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let data;
fetch("events.json", { cache: "no-cache" }).then(r => r.json()).then(d => { data = d; render(); })
  .catch(() => { document.getElementById("out").innerHTML = '<p class="empty">Couldn\'t load events.</p>'; });

function range() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(Math.max(today, parse(data.from)));
  const end = addDays(start, state.tab === "week" ? 6 : 29);
  return [start, end];
}

function render() {
  if (!data) return;
  const [start, end] = range();
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  document.getElementById("range").textContent =
    fmt(start, { weekday: "short", day: "numeric", month: "short" }) + " – " + fmt(end, { weekday: "short", day: "numeric", month: "short" }) + " " + end.getFullYear();

  const inRange = data.events.filter(e => parse(e.start) <= end && parse(e.end || e.start) >= start);
  const present = Object.keys(CATS).filter(c => inRange.some(e => e.category === c));
  // Fall back to All while the chosen category is empty, but remember it for other tabs.
  const cat = present.includes(state.cat) ? state.cat : "";
  document.getElementById("chips").innerHTML =
    `<button class="chip" role="tab" data-cat="" aria-selected="${!cat}">All</button>` +
    present.map(c => `<button class="chip" role="tab" data-cat="${c}" aria-selected="${cat === c}">${CATS[c]}</button>`).join("");

  const shown = inRange.filter(e => !cat || e.category === cat)
    .sort((a, b) => Math.max(parse(a.start), start) - Math.max(parse(b.start), start) || (a.time || "").localeCompare(b.time || ""));

  let html = "";
  const notes = (data.notes || []).filter(n => parse(n.start) <= end && parse(n.end || n.start) >= start);
  const picks = shown.filter(e => e.pick);
  if (picks.length) html += `<div class="picks"><h2>Top picks</h2><ul>${picks.map(e =>
    `<li><a href="${esc(e.url)}">${esc(e.title)}</a> · ${esc(when(e, start, true))}, ${esc(e.town)}</li>`).join("")}</ul></div>`;
  if (state.tab === "week") html += notes.map(n => `<div class="note">${esc(n.text)}${n.url ? ` <a href="${esc(n.url)}">More</a>` : ""}</div>`).join("");

  if (!shown.length) html += '<p class="empty">Nothing in this category for these dates.</p>';
  else if (cat === "art") {
    for (const [name, test] of ART_GROUPS) {
      const list = shown.filter(test);
      html += `<h2 class="area">${name}</h2>` + (list.length ? list.map(e => card(e, start, true)).join("") : '<p class="empty">Nothing listed for these dates.</p>');
    }
  } else if (state.tab === "week") {
    for (const a of Object.keys(AREAS)) {
      const list = shown.filter(e => e.area === a);
      if (!list.length) continue;
      html += `<h2 class="area">${AREAS[a]}</h2>` + list.map(e => card(e, start, false)).join("");
    }
  } else {
    let wk = null;
    for (const e of shown) {
      const d = new Date(Math.max(parse(e.start), start));
      const monday = addDays(d, -((d.getDay() + 6) % 7));
      if (+monday !== wk) { wk = +monday; html += `<h3 class="week">Week of ${fmt(monday, { day: "numeric", month: "long" })}</h3>`; }
      html += card(e, start, true);
    }
  }
  document.getElementById("out").innerHTML = html;
  document.getElementById("foot").textContent = "Last updated " + fmt(parse(data.generated), { day: "numeric", month: "long", year: "numeric" }) +
    ". Gathered from local listings (vilnius-events.lt, kaveikti.lt, kcelektrenai.lt, trakai-visit.lt, kaisiadorysinfo.lt and others). Check the event page before you go.";
}

function when(e, start, short) {
  const s = parse(e.start), en = e.end ? parse(e.end) : null;
  const o = { weekday: "short", day: "numeric", month: "short" };
  if (en && +en !== +s) return (s < start ? "Until " + fmt(en, o) : fmt(s, o) + " – " + fmt(en, o));
  return fmt(s, o) + (!short && e.time ? " · " + e.time : "");
}

function card(e, start, showArea) {
  const d = new Date(Math.max(parse(e.start), start));
  const multi = e.end && e.end !== e.start;
  const meta = [when(e, start), multi && e.time ? e.time : null, [e.venue, e.venue === e.town ? null : e.town].filter(Boolean).join(", "), e.price].filter(Boolean).join(" · ");
  return `<div class="ev"><div class="date"><div class="d">${d.getDate()}</div><div class="w">${fmt(d, { weekday: "short" })}</div>
    <button class="addcal" data-i="${data.events.indexOf(e)}" title="Add to calendar" aria-label="Add to calendar: ${esc(e.title)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg></button></div><div>
    <span class="tag">${CATS[e.category] || ""}</span>${showArea ? `<span class="tag" style="color:var(--muted)">${e.area === "vilnius" ? "Vilnius" : esc(e.town)}</span>` : ""}${LANGS[e.lang] ? `<span class="tag lang">${LANGS[e.lang]}</span>` : ""}
    <div><a class="title" href="${esc(e.url)}">${esc(e.title)}</a></div>
    <div class="meta">${esc(meta)}</div><p class="desc">${esc(e.desc)}</p></div></div>`;
}

// Calendar entries. A plain "HH:MM" or "HH:MM–HH:MM" time on a one-day event becomes a
// timed entry (2 hours if no end is given); anything else is an all-day entry, with the
// time text kept in the description. With a day given, the entry is for that day only.
function calTimes(e, day) {
  if (day) e = { ...e, start: day, end: null };
  const ymd = s => s.replace(/-/g, "");
  const m = !e.end || e.end === e.start ? /^(\d{1,2}):(\d{2})(?:\s*[–-]\s*(\d{1,2}):(\d{2}))?$/.exec(e.time || "") : null;
  if (!m) return { allDay: true, start: ymd(e.start), end: ymd(isoDay(addDays(parse(e.end || e.start), 1))) };
  const s = parse(e.start); s.setHours(+m[1], +m[2]);
  let en;
  if (m[3]) {
    en = parse(e.start);
    if (+m[3] * 60 + +m[4] <= +m[1] * 60 + +m[2]) en = addDays(en, 1); // ends after midnight
    en.setHours(+m[3], +m[4]);
  }
  else en = new Date(s.getFullYear(), s.getMonth(), s.getDate(), s.getHours() + 2, s.getMinutes());
  const stamp = d => isoDay(d).replace(/-/g, "") + "T" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "00";
  return { allDay: false, start: stamp(s), end: stamp(en) };
}
const isoDay = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const calPlace = e => [e.venue, e.venue === e.town ? null : e.town].filter(Boolean).join(", ");
const calDetails = (e, t) => [e.desc, t.allDay && e.time ? "Time: " + e.time : null, e.price ? "Price: " + e.price : null, e.url].filter(Boolean).join("\n\n");

function gcalUrl(e, day) {
  const t = calTimes(e, day);
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action: "TEMPLATE", text: e.title, dates: t.start + "/" + t.end, details: calDetails(e, t), location: calPlace(e), ctz: "Europe/Vilnius",
  });
}

function icsFile(e, day) {
  const t = calTimes(e, day);
  const text = s => String(s).replace(/[\\;,]/g, c => "\\" + c).replace(/\n/g, "\\n");
  const when = (k, v) => t.allDay ? `${k};VALUE=DATE:${v}` : `${k};TZID=Europe/Vilnius:${v}`;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//grantrosson.com//Events//EN", "BEGIN:VEVENT",
    `UID:${t.start}-${e.title.replace(/[^\w]+/g, "-").slice(0, 40)}@grantrosson.com`,
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]|\.\d+/g, ""),
    when("DTSTART", t.start), when("DTEND", t.end),
    "SUMMARY:" + text(e.title), "LOCATION:" + text(calPlace(e)), "DESCRIPTION:" + text(calDetails(e, t)), "URL:" + e.url,
    "END:VEVENT", "END:VCALENDAR"];
  // Fold lines at 74 UTF-8 bytes (RFC 5545), never inside a character.
  const fold = l => {
    let out = "", n = 0;
    for (const ch of l) {
      const b = new TextEncoder().encode(ch).length;
      if (n + b > 74) { out += "\r\n "; n = 1; }
      out += ch; n += b;
    }
    return out;
  };
  return lines.map(fold).join("\r\n") + "\r\n";
}

document.querySelector(".tabs").addEventListener("click", ev => {
  const b = ev.target.closest(".tab"); if (!b) return;
  state.tab = b.dataset.tab; try { localStorage.setItem("events-tab", state.tab); } catch (e) {}
  render();
});
// Add-to-calendar pop-up. Multi-day events ask which day, so the entry goes on the day you plan to go.
const dlg = document.getElementById("cal"), dayInput = dlg.querySelector("input"), gLink = dlg.querySelector("a");
let calEvent = null;
const calDay = () => calEvent.end && calEvent.end !== calEvent.start ? dayInput.value || null : null;
const syncGoogle = () => { gLink.href = gcalUrl(calEvent, calDay()); };
document.getElementById("out").addEventListener("click", ev => {
  const b = ev.target.closest(".addcal"); if (!b) return;
  calEvent = data.events[b.dataset.i];
  dlg.querySelector(".t").textContent = calEvent.title;
  const multi = calEvent.end && calEvent.end !== calEvent.start;
  dayInput.parentElement.hidden = !multi;
  if (multi) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    dayInput.min = dayInput.value = isoDay(new Date(Math.max(parse(calEvent.start), today)));
    dayInput.max = calEvent.end;
  }
  syncGoogle();
  dlg.showModal();
});
dayInput.addEventListener("input", syncGoogle);
gLink.addEventListener("click", () => dlg.close());
dlg.querySelector(".ics").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([icsFile(calEvent, calDay())], { type: "text/calendar" }));
  a.download = calEvent.title.replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").slice(0, 50) + ".ics";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  dlg.close();
});
dlg.querySelector(".x").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", ev => { // close on a tap outside the box (the backdrop)
  const r = dlg.getBoundingClientRect();
  if (ev.target === dlg && (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom)) dlg.close();
});
document.getElementById("chips").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b) return;
  state.cat = b.dataset.cat;
  render();
});
</script>
</body>
</html>
